version: '3.8'

# Production stack for 1daa.ru/tochka/ (docker-compose v1 compatible)
# Usage: docker-compose -f docker-compose.production.yml up -d --build

services:
  database:
    image: postgres:17-alpine
    container_name: tochka-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tochka_app}
      POSTGRES_USER: ${DB_USER:-tochka_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - tochka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tochka_user} -d ${DB_NAME:-tochka_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tochka-net

  api:
    build:
      context: ./backends/python
      dockerfile: api/Dockerfile
      target: prod
    container_name: tochka-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: database
      PORT: 8000
      DJANGO_ENV: production
    ports:
      - "127.0.0.1:${TOCHKA_API_PORT:-8010}:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - tochka-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NUXT_APP_BASE_URL: ${APP_BASE_PATH:-/tochka/}
    container_name: tochka-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      NUXT_APP_BASE_URL: ${APP_BASE_PATH:-/tochka/}
      NUXT_PUBLIC_APP_URL: ${VIRTUAL_HOST}
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
    ports:
      - "127.0.0.1:${TOCHKA_FRONTEND_PORT:-3010}:3000"
    depends_on:
      - api
    networks:
      - tochka-net

networks:
  tochka-net:
    driver: bridge

volumes:
  tochka_postgres_data:
