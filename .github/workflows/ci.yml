name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (# vX.Y.Z comment);
# Dependabot bumps them weekly. Do not add @vN tag refs.

# Least-privilege token: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the `packageManager` field; the action reads the
      # root package.json by default, so point it at this job's package.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile — same as Docker)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  backend-node:
    name: Node backend (install · syntax · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backends/node/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the `packageManager` field; the action reads the
      # root package.json by default, so point it at this job's package.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: backends/node/api/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backends/node/api/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: node --check server.js && node --check utils/verifyToken.js && node --check utils/verifyFrontendAuth.js

      - name: Unit tests
        run: pnpm test

  backend-php:
    name: PHP backend (composer validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backends/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2

      # `composer validate` verifies composer.json is well-formed AND that
      # composer.lock is in sync with it — this is exactly the drift that
      # broke `make composer-install` (issue #19). Full `composer install` is
      # skipped because several dependencies are dev-branch git sources that
      # require GitHub authentication not available to a generic CI runner.
      - name: Validate composer.json / composer.lock
        # No --strict: benign schema warnings (version field, unbound constraint)
        # must not fail CI, but a lock out of sync with composer.json still
        # returns a non-zero exit — which is exactly the #19 drift we guard against.
        run: composer validate --no-check-publish

  backend-python:
    name: Python backend (install · Django check · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backends/python/django
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backends/python/django/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run

      - name: Unit tests (no database needed)
        run: python manage.py test

  repo-lint:
    name: Repo lint (actionlint · markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows (actionlint)
        # Pinned release asset, not a mutable tag.
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Lint agent & contributor guides (markdownlint)
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          globs: |
            AGENTS.md
            CLAUDE.md
            SECURITY.md
            CHANGELOG.md
            .github/contributing/**/*.md
            .claude/skills/**/*.md
