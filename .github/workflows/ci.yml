name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (# vX.Y.Z comment);
# Dependabot bumps them weekly. Do not add @vN tag refs.

# Least-privilege token: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the `packageManager` field; the action reads the
      # root package.json by default, so point it at this job's package.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile — same as Docker)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  backend-node:
    name: Node backend (install · syntax · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backends/node/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the `packageManager` field; the action reads the
      # root package.json by default, so point it at this job's package.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: backends/node/api/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backends/node/api/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: node --check server.js && node --check utils/verifyToken.js && node --check utils/verifyFrontendAuth.js

      - name: Unit tests
        run: pnpm test

  backend-php:
    name: PHP backend (validate · install · container · test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backends/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: intl, bcmath, amqp, sockets, pdo_pgsql, pdo_mysql
        env:
          # lets composer download GitHub-hosted packages (incl. dev branches of
          # bitrix24/b24phpsdk) without anonymous API rate limits — no extra secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `composer validate` verifies composer.json is well-formed AND that
      # composer.lock is in sync with it (issue #19). No --strict: benign schema
      # warnings (version field, unbound constraint) must not fail CI.
      - name: Validate composer.json / composer.lock
        run: composer validate --no-check-publish

      - name: Install (from composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      # Boots the prod container: catches config/bundle/DI breakage (e.g. options
      # removed by a dependency upgrade) that unit tests do not load.
      - name: Symfony container (prod)
        run: php bin/console lint:container --env=prod

      - name: Unit tests (security + telemetry)
        run: vendor/bin/phpunit

  backend-python:
    name: Python backend (install · Django check · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backends/python/django
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backends/python/django/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run

      - name: Unit tests (no database needed)
        run: python manage.py test

  repo-lint:
    name: Repo lint (actionlint · markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows (actionlint)
        # Pinned release asset, not a mutable tag.
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Lint agent & contributor guides (markdownlint)
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          globs: |
            AGENTS.md
            CLAUDE.md
            SECURITY.md
            CHANGELOG.md
            .github/contributing/**/*.md
            .claude/skills/**/*.md

  docker:
    name: Docker images (build · smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare .env
        run: cp .env.example .env

      # Production images of every service (the stages users run with make prod-*),
      # plus the PHP images. Catches Dockerfile / lockfile / build-context mistakes.
      - name: Build images
        run: |
          COMPOSE_PROFILES=frontend,php,python,node \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build \
            frontend api-php php-cli api-python api-node

      # One backend end to end with a real database: liveness is public,
      # data routes need a JWT, getToken does not hand out tokens to anyone.
      - name: Smoke test (Node backend + PostgreSQL)
        run: |
          COMPOSE_PROFILES=node,db-postgres BUILD_TARGET=production \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait database-postgres api-node
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/enum)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"DOMAIN":"example.bitrix24.ru","member_id":"x","AUTH_ID":"forged"}' \
            http://localhost:8000/api/getToken)" = 401

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

