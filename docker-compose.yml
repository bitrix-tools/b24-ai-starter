services:
  # (~) Database
  database-postgres:
    profiles: ["db-postgres"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./logs/postgres:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      internal-net:
        aliases:
          - database

  database-mysql:
    profiles: ["db-mysql"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-appdb}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/database/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
      - ./logs/mysql:/var/log/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      internal-net:
        aliases:
          - database

  # (~) RabbitMQ
  rabbitmq:
    profiles: ["queue"]
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-queue_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-queue_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./logs/rabbitmq:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  # (~) Frontend
  frontend:
    profiles: [ "frontend" ]
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-dev}
    env_file: .env
    environment:
      NUXT_PUBLIC_APP_URL: ${VIRTUAL_HOST}
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
      NUXT_PUBLIC_TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      HTTP: frontend:3000
    expose:
      - '3000'
    # ports:
    #  - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - internal-net

  # (~) Cloudpub - for frontend
  cloudpub:
    profiles: ["cloudpub"]
    container_name: cloudpubFront
    image: ${CLOUDPUB_IMAGE:-cloudpub/cloudpub:latest}
    platform: ${CLOUDPUB_PLATFORM:-linux/amd64}
    restart: unless-stopped
    env_file: .env
    environment:
      TOKEN: ${CLOUDPUB_TOKEN}
      HTTP: frontend:3000
    command: run
    depends_on:
      - frontend
    volumes:
      - cloudpub-config:/home/cloudpub
    networks:
      - internal-net

  # (~) API servers (selected via profile)
  api-php:
    profiles: ["php"]
    build:
      context: ./backends/php
      dockerfile: docker/php-fpm/Dockerfile
    container_name: api
    env_file: .env
    environment:
      DB_HOST: database
      NODE_ENV: ${NODE_ENV:-development}
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
      BITRIX24_PHP_SDK_APPLICATION_CLIENT_ID: ${CLIENT_ID:-enter_your_b24_app_client_id}
      BITRIX24_PHP_SDK_APPLICATION_CLIENT_SECRET: ${CLIENT_SECRET:-enter_your_b24_app_secret}
      BITRIX24_PHP_SDK_APPLICATION_SCOPE: ${SCOPE:-enter_your_b24_app_scope}
    expose:
      - "8000"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backends/php/:/var/www
      - ./logs/php:/var/log/php
    depends_on:
      database-postgres:
        condition: service_healthy
        required: false
      database-mysql:
        condition: service_healthy
        required: false
    networks:
      - internal-net

  php-cli:
    profiles: ["php", "php-cli"]
    build:
      context: ./backends/php
      dockerfile: docker/php-cli/Dockerfile
    container_name: php-cli
    env_file: .env
    environment:
      DB_HOST: database
      NODE_ENV: ${NODE_ENV:-development}
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
      BITRIX24_PHP_SDK_APPLICATION_CLIENT_ID: ${CLIENT_ID:-enter_your_b24_app_client_id}
      BITRIX24_PHP_SDK_APPLICATION_CLIENT_SECRET: ${CLIENT_SECRET:-enter_your_b24_app_secret}
      BITRIX24_PHP_SDK_APPLICATION_SCOPE: ${SCOPE:-enter_your_b24_app_scope}
    volumes:
      - ./backends/php/:/var/www
      - ./logs/php:/var/log/php
    depends_on:
      database-postgres:
        condition: service_healthy
        required: false
      database-mysql:
        condition: service_healthy
        required: false
    networks:
      - internal-net
    stdin_open: true
    tty: true


  api-python:
    profiles: ["python"]
    build:
      context: ./backends/python/django
      dockerfile: ./Dockerfile
      target: ${BUILD_TARGET:-dev}
    container_name: api
    env_file: .env
    environment:
      DB_HOST: database
      PORT: 8000
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
    expose:
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backends/python/django:/var/www/api
      - ./logs/python:/var/log/python
    depends_on:
      database-postgres:
        condition: service_healthy
        required: false
      database-mysql:
        condition: service_healthy
        required: false
    networks:
      - internal-net

  python-worker:
    profiles: ["python-worker"]
    build:
      context: ./backends/python/django
      dockerfile: ./Dockerfile
      target: ${BUILD_TARGET:-dev}
    container_name: python-worker
    env_file: .env
    environment:
      DB_HOST: database
      CELERY_BROKER_URL: ${RABBITMQ_DSN:-amqp://queue_user:queue_password@rabbitmq:5672//}
    command: celery -A celery_app:celery_app worker --loglevel=info
    volumes:
      - ./backends/python/django:/var/www/api
      - ./logs/python:/var/log/python
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
      database-postgres:
        condition: service_healthy
        required: false
      database-mysql:
        condition: service_healthy
        required: false
    networks:
      - internal-net

  api-node:
    profiles: ["node"]
    container_name: api
    build:
      context: ./backends/node/api
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-dev}
    env_file: .env
    environment:
      DB_HOST: database
      NODE_ENV: ${NODE_ENV:-development}
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
      PORT: 8000
    expose:
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backends/node/api:/app
      - ./logs/node:/var/log/node
    depends_on:
      database-postgres:
        condition: service_healthy
        required: false
      database-mysql:
        condition: service_healthy
        required: false
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  cloudpub-config:
  rabbitmq_data:
