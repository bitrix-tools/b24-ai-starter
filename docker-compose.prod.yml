# Production overrides: localhost ports, no cloudpub, production build.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile python --profile frontend --profile db-postgres up -d --build

services:
  frontend:
    build:
      target: production
      args:
        NUXT_APP_BASE_URL: ${APP_BASE_PATH:-/tochka/}
    environment:
      NODE_ENV: production
      PORT: "3000"
      NUXT_APP_BASE_URL: ${APP_BASE_PATH:-/tochka/}
      NUXT_PUBLIC_APP_URL: ${VIRTUAL_HOST}
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
    ports:
      - "127.0.0.1:${TOCHKA_FRONTEND_PORT:-3010}:3000"
    volumes: !reset []

  api-python:
    build:
      target: prod
    environment:
      NODE_ENV: production
      DJANGO_ENV: production
    ports:
      - "127.0.0.1:${TOCHKA_API_PORT:-8010}:8000"
    volumes: !reset []

  database-postgres:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
